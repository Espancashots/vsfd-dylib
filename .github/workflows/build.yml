name: Build SatanabeCleanUI v4.1

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'Makefile'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          set -euxo pipefail
          test -f Source/SatanabeCleanUI.mm
          test -f Makefile
          find . -maxdepth 3 -type f | sort

      - name: Toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and diagnose
        run: |
          set -euxo pipefail
          make clean
          make inspect

      - name: Package
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp build/SatanabeCleanUI.dylib dist/
          shasum -a 256 build/SatanabeCleanUI.dylib > dist/SHA256.txt
          ditto -c -k --sequesterRsrc --keepParent dist SatanabeCleanUI-v4.1.zip

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: SatanabeCleanUI-v4.1
          path: |
            build/SatanabeCleanUI.dylib
            SatanabeCleanUI-v4.1.zip
          if-no-files-found: error
          retention-days: 30
